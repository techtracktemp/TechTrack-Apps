<!DOCTYPE html>

<!-- TechTrack apps landing page (Nov 3 2026). Links to the TechTrack app and the Vendor Portal app. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TechTrack Apps</title>
<link rel="icon" type="image/png" sizes="32x32" href="techtrack/icons/favicon-32.png">
<style>
  body { margin: 0; min-height: 100vh; background: #0F1B2D; color: #fff; font-family: Calibri, 'Segoe UI', Arial, sans-serif;
         display: flex; align-items: center; justify-content: center; padding: 24px 16px; box-sizing: border-box; }
  main { width: 100%; max-width: 520px; text-align: center; }
  h1 { font-size: 26px; margin: 12px 0 6px; letter-spacing: 1px; }
  p { color: #A9B8CC; margin: 0 0 22px; line-height: 1.4; }
  a.app { display: flex; align-items: center; gap: 14px; text-align: left; background: #16263D; border: 1px solid #2B4566; border-radius: 12px;
          padding: 14px; margin-bottom: 12px; color: #fff; text-decoration: none; }
  a.app:hover { border-color: #8FB3DA; }
  a.app img { width: 56px; height: 56px; border-radius: 12px; }
  a.app b { display: block; font-size: 18px; }
  a.app span { color: #A9B8CC; font-size: 14px; }

<body>
<main>
  <img src="techtrack/icons/logo.png" alt="MCR" width="88" height="88">
  <h1>TechTrack Apps</h1>
  <p>Open one on your phone or laptop, then add it to your home screen or install it.</p>
  <a class="app" href="techtrack/"><img src="techtrack/icons/icon-192.png" alt=""><div><b>TechTrack</b><span>MCR staff: projects, Capex, Coupa, vendors</span></div></a>
  <a class="app" href="vendor-portal/"><img src="vendor-portal/icons/icon-192.png" alt=""><div><b>TechTrack Vendor Portal</b><span>Vendors: your MCR projects, quotes, schedules, invoices</span></div></a>
