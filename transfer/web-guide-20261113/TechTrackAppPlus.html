<!-- C.Perry -->
<!--
  TechTrack App Plus (Nov 1 2026). Included at the bottom of TechTrackApp.html.
  Adds, without changing how the existing screens work:
    1. Every Sheets menu and sidebar item in the left nav, in the same groups.
       Items run your real functions (TechTrackAppRunner.gs); pop-ups open
       inside the app, Yes/No and typed answers are asked in the app, and a
       pop-up that opens another pop-up keeps working.
    2. Admin, Committee Glance (Weekly, T53, Other Funds) with Email me,
       Reporting Hub (any tab, combine, columns, filters, group, sort, saved
       reports shared by Chris and Kyle, Blue Box exports), Insights,
       Support Context, Help and Training, and a guided tour.
  Screens use the dark app look. PDF, Excel and email exports stay Blue Box.
-->
<style>
  .modal-bg { position: fixed; inset: 0; background: rgba(4,10,20,.72); z-index: 90; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .modal { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; width: 100%; max-width: 520px; box-shadow: 0 20px 50px rgba(0,0,0,.6); overflow: hidden; }
  .modal .mh { background: var(--navy); padding: 12px 16px; font-weight: bold; font-size: 16px; }
  .modal .mb { padding: 16px; white-space: pre-wrap; line-height: 1.4; max-height: 60vh; overflow: auto; }
  .modal .mf { padding: 12px 16px; display: flex; gap: 8px; justify-content: flex-end; border-top: 1px solid var(--line); }
  .toolhead { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .frame.tool { height: calc(100vh - 170px); }
  .navfind { margin: 4px 4px 8px; }
  .navfind input { padding: 6px 9px; font-size: 13px; }
  .nav-group .nav-item.dim { color: var(--dim); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; align-items: start; }
  @media (max-width: 1100px) { .grid2 { grid-template-columns: 1fr; } }
  .frow { display: flex; gap: 10px; align-items: center; margin: 8px 0; flex-wrap: wrap; }
  .frow label { color: var(--muted); font-size: 13px; min-width: 150px; }
  .switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
  .switch input { width: auto; }
  table.grid { border-collapse: collapse; width: 100%; font-size: 13px; }
  table.grid th { text-align: left; background: #0C1726; color: var(--accent); padding: 7px 8px; border-bottom: 1px solid var(--line); cursor: pointer; white-space: nowrap; position: sticky; top: 0; }
  table.grid td { padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  table.grid tr.grp td { background: var(--panel2); font-weight: bold; cursor: pointer; }
  table.grid tr.tot td { background: #0F2036; font-weight: bold; }
  table.grid td.num { text-align: right; white-space: nowrap; }
  .gridwrap { overflow: auto; max-height: calc(100vh - 330px); border: 1px solid var(--line); border-radius: 8px; }
  .hub { display: grid; grid-template-columns: 300px 1fr; gap: 14px; align-items: start; }
  @media (max-width: 1100px) { .hub { grid-template-columns: 1fr; } }
  .hubside .card { margin-bottom: 10px; }
  .hubside .cb { padding: 10px 12px; }
  .colpick { max-height: 220px; overflow: auto; border: 1px solid var(--line); border-radius: 6px; padding: 6px; }
  .colpick label { display: flex; gap: 6px; align-items: center; font-size: 13px; padding: 2px 0; cursor: pointer; }
  .colpick input { width: auto; }
  .fl { display: grid; grid-template-columns: 1fr 90px 1fr 26px; gap: 4px; margin: 4px 0; }
  .fl input, .fl select { padding: 5px 6px; font-size: 13px; }
  .ins { border-left: 4px solid var(--line); }
  .ins.high { border-left-color: var(--red); } .ins.medium { border-left-color: var(--amber); } .ins.low { border-left-color: var(--blue); } .ins.info { border-left-color: var(--green); }
  .kb { background: #0F2036; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin: 6px 0; font-size: 13px; }
  .kb b { color: var(--accent); }
  .steps-ol li { margin: 4px 0; }
  .help h3 { margin: 6px 0; }
  .help p, .help li { color: var(--text); line-height: 1.45; }
  .tour-hl { position: relative; z-index: 95 !important; box-shadow: 0 0 0 3px var(--amber), 0 0 0 9999px rgba(4,10,20,.65) !important; border-radius: 8px; }
  .tour-tip { position: fixed; z-index: 96; background: var(--panel); border: 1px solid var(--amber); border-radius: 10px; padding: 14px 16px; max-width: 360px; box-shadow: 0 12px 30px rgba(0,0,0,.6); }
  .tour-tip h4 { margin: 0 0 6px; }
  .tour-tip .tf { display: flex; gap: 8px; justify-content: flex-end; margin-top: 10px; }
</style>

<script>
(function () {
  var base = { buildNav: buildNav, render: render, exportModel: exportModel, hotelDetail: hotelDetail };
  S.plus = { menu: null, admin: null, com: {}, comF: {}, hub: { sources: null, data: {}, spec: null, saved: null }, ins: null, insF: {}, tool: null };

  /* ===================== MODALS ===================== */
  function modal(title, bodyHtml, buttons) {
    return new Promise(function (resolve) {
      var bg = document.createElement('div'); bg.className = 'modal-bg';
      bg.innerHTML = '<div class="modal"><div class="mh">' + esc(title || 'TechTrack') + '</div><div class="mb">' + bodyHtml + '</div><div class="mf"></div></div>';
      var mf = bg.querySelector('.mf');
      buttons.forEach(function (b, i) {
        var el = document.createElement('button'); el.className = 'btn' + (b.primary ? ' primary' : ''); el.textContent = b.label;
        el.onclick = function () { var v = typeof b.value === 'function' ? b.value(bg) : b.value; bg.remove(); resolve(v); };
        mf.appendChild(el);
      });
      document.body.appendChild(bg);
      var inp = bg.querySelector('input'); if (inp) { inp.focus(); inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') mf.lastChild.click(); }); }
    });
  }
  function ask(inp) {
    if (inp.type === 'prompt') {
      var btns = [{ label: 'Cancel', value: { text: '', button: 'CANCEL' } }, { label: 'OK', primary: true, value: function (bg) { return { text: bg.querySelector('input').value, button: 'OK' }; } }];
      if (/YES/.test(inp.buttons)) btns = [{ label: 'Cancel', value: { text: '', button: 'CANCEL' } }, { label: 'No', value: function (bg) { return { text: bg.querySelector('input').value, button: 'NO' }; } }, { label: 'Yes', primary: true, value: function (bg) { return { text: bg.querySelector('input').value, button: 'YES' }; } }];
      return modal(inp.title, esc(inp.msg) + '<input style="margin-top:12px" autocomplete="off">', btns);
    }
    var b = inp.buttons || 'OK';
    var list = /YES_NO_CANCEL/.test(b) ? [['Cancel', 'CANCEL'], ['No', 'NO'], ['Yes', 'YES']] : /YES_NO/.test(b) ? [['No', 'NO'], ['Yes', 'YES']] : /OK_CANCEL/.test(b) ? [['Cancel', 'CANCEL'], ['OK', 'OK']] : [['OK', 'OK']];
    return modal(inp.title, esc(inp.msg), list.map(function (x, i) { return { label: x[0], value: x[1], primary: i === list.length - 1 }; }));
  }
  function showAlerts(title, alerts, error, result) {
    var parts = (alerts || []).slice();
    if (error) parts.push('Error: ' + error);
    if (!parts.length && result && result !== 'undefined' && result !== 'null') parts.push(String(result).slice(0, 1500));
    if (!parts.length) { toast((title || 'Done') + ': finished'); return; }
    modal(title || 'TechTrack', esc(parts.join('\n\n')), [{ label: 'OK', primary: true, value: true }]);
  }
  window.ttModal = modal;

  /* ===================== RUN ANY SHEETS MENU ITEM ===================== */
  function runTool(fn, args, answers, label) {
    toast('Opening ' + (label || fn) + '...');
    return gs('ttRun', S.token, fn, args || [], answers || []).then(function (res) {
      if (res.needInput) {
        if ((res.alerts || []).length) toast(res.alerts.join(' '));
        return ask(res.needInput).then(function (ans) {
          if (ans === 'CANCEL' || (ans && ans.button === 'CANCEL')) { toast('Cancelled'); return; }
          return runTool(fn, args, (res.answers || []).concat([ans]), label);
        });
      }
      if (res.view) {
        if (S.view !== 'tool') S.plus.back = S.view;
        S.plus.tool = { key: res.view, title: res.title || label || fn, fn: fn };
        S.view = 'tool'; render();
        if ((res.alerts || []).length) toast(res.alerts.join(' '));
        return;
      }
      showAlerts(label || fn, res.alerts, res.error, res.result);
      S.plus.stale = true;
    }).catch(function (e) { toast(e.message, true); });
  }
  window.ttRunTool = runTool;
  window.addEventListener('message', function (e) {
    var d = e && e.data; if (!d || typeof d !== 'object' || !d.tt) return;
    if (d.tt === 'close' && S.view === 'tool') { go(S.plus.back || 'myday'); if (S.plus.stale) { S.plus.stale = false; refresh(); } }
    if (d.tt === 'run' && d.fn) runTool(d.fn, d.args || [], [], d.fn);
  });
  function renderTool() {
    var t = S.plus.tool; if (!t) return go('myday');
    hideBar();
    var url = BOOT.webAppUrl + '?run=' + encodeURIComponent(t.key) + '&t=' + encodeURIComponent(S.token);
    $('view').innerHTML = '<div class="hello toolhead" style="padding:10px 16px;"><button class="btn small" onclick="go(S.plus.back||\'myday\')">&#8592; Back</button><b>' + esc(t.title) +
      '</b><span style="color:var(--muted);font-size:13px;">Full-page tool. Its own buttons work here; Close brings you back.</span>' +
      '<button class="btn small" style="margin-left:auto" onclick="ttRunTool(\'' + esc(t.fn) + '\',[],[],\'' + esc(t.title).replace(/'/g, '') + '\')">Reload</button>' +
      '<a class="btn small" style="text-decoration:none" target="_blank" href="' + esc(url) + '">Open in new tab</a></div>' +
      '<iframe class="frame tool" src="' + esc(url) + '"></iframe>';
  }

  function menuClick(fn, kind, name) {
    if (kind.indexOf('n:add:') === 0) { var sheet = kind.slice(6); go('table:' + sheet); var w = setInterval(function () { if (S.tables[sheet]) { clearInterval(w); S.table = sheet; openNew(); } }, 200); setTimeout(function () { clearInterval(w); }, 15000); return; }
    if (kind.indexOf('n:committee:') === 0) return go('committee:' + kind.slice(12));
    if (kind === 'n:help') return go('help');
    if (kind === 'n:loaders') return go('loaders');
    runTool(fn, [], [], name);
  }
  window.ttMenuClick = menuClick;

  /* ===================== NAV ===================== */
  window.buildNav = function () {
    base.buildNav();
    var nav = $('nav');
    var top = '<div class="nav-group"><div class="gi">' +
      navItem('insights', 'Insights') + navItem('hub', 'Reporting Hub') + '</div></div>' +
      navGroup('COMMITTEE', navItem('committee:weekly', 'Weekly Committee Glance') + navItem('committee:T53', 'T53 Committee Glance') + navItem('committee:OTHER', 'Other Funds Glance'));
    var after = navGroup('SETTINGS AND HELP', navItem('admin', 'Admin') + navItem('help', 'Help and Training') + '<button class="nav-item" onclick="ttTour(true)">Take the tour</button>') +
      '<div class="nav-group"><div class="gh" style="cursor:default">SHEETS MENU</div><div class="navfind"><input id="navFind" placeholder="Find any menu item" oninput="ttNavFind(this.value)"></div></div><div id="sheetMenu"><div class="loading" style="padding:8px 12px"><span class="spin"></span>Loading menu...</div></div>';
    var first = nav.querySelector('.nav-group');
    var wrap = document.createElement('div'); wrap.innerHTML = top;
    while (wrap.firstChild) nav.insertBefore(wrap.firstChild, first);
    nav.insertAdjacentHTML('beforeend', after);
    (S.plus.menu ? Promise.resolve(S.plus.menu) : gs('ttMenu', S.token)).then(function (m) { S.plus.menu = m; paintMenu(''); markNav(); })
      .catch(function (e) { var el = $('sheetMenu'); if (el) el.innerHTML = '<div style="padding:8px 12px;color:var(--muted);font-size:13px;">Sheets menu not installed yet (TechTrackAppRunner.gs).</div>'; });
  };
  function paintMenu(q) {
    var el = $('sheetMenu'); if (!el || !S.plus.menu) return;
    q = norm(q);
    el.innerHTML = S.plus.menu.map(function (g) {
      var items = g.i.filter(function (it) { return !q || norm(it.name + ' ' + it.desc).indexOf(q) !== -1; });
      if (!items.length) return '';
      return navGroup(esc(g.t.toUpperCase()), items.map(function (it) {
        return '<button class="nav-item' + (it.ok ? '' : ' dim') + '" title="' + esc(it.desc || '') + (it.ok ? '' : ' (not in this project)') + '" onclick="ttMenuClick(\'' + esc(it.fn) + '\',\'' + esc(it.kind) + '\',\'' + esc(it.name).replace(/'/g, '') + '\')">' + esc(it.name) + '</button>';
      }).join(''), !q);
    }).join('');
  }
  window.ttNavFind = function (v) { paintMenu(v); };

  /* ===================== RENDER ===================== */
  // The new screens have their own filters, so the shared project filter bar is hidden on them.
  function hideBar() { var b = $('fbar'); if (b) { b.innerHTML = ''; b.style.display = 'none'; } }
  window.render = function () {
    var v = S.view;
    var fb = $('fbar'); if (fb) fb.style.display = '';
    if (v === 'tool') { markNav(); return renderTool(); }
    if (v === 'admin') { markNav(); return renderAdmin(); }
    if (v.indexOf('committee:') === 0) { markNav(); return renderCommittee(v.slice(10)); }
    if (v === 'hub') { markNav(); return renderHub(); }
    if (v === 'insights') { markNav(); return renderInsights(); }
    if (v === 'help') { markNav(); return renderHelp(); }
    return base.render();
  };

  /* ===================== ADMIN ===================== */
  function renderAdmin(force) {
    hideBar();
    if (!S.plus.admin || force) {
      $('view').innerHTML = '<div class="loading"><span class="spin"></span>Loading Admin...</div>';
      return gs('ttAdminGet', S.token).then(function (a) { S.plus.admin = a; renderAdmin(); }).catch(function (e) { $('view').innerHTML = '<div class="conf">' + esc(e.message) + '</div>'; });
    }
    var a = S.plus.admin;
    var sw = function (key, on, label, note) { return '<div class="frow"><label class="switch"><input type="checkbox" ' + (on ? 'checked' : '') + ' onchange="ttAdminSet(\'' + key + '\', this.checked)"> ' + esc(label) + '</label><span style="color:var(--muted);font-size:13px">' + esc(note) + '</span></div>'; };
    var modes = sw('testMode', a.testMode, 'Test Mode', 'While on, automated emails and Teams posts are held or redirected so you can test safely.') +
      sw('sendOnlyToMe', a.sendOnlyToMe, 'Send Only To Me', 'Every automated email goes to Chris only.') +
      sw('automations', a.automations, 'Run sheet automations on Save', 'Archive on Complete, End Date, moves, Teams and notifications run once, in the background, after Save.');
    var n = a.notif || {};
    var notif = '<div class="frow"><label class="switch"><input type="checkbox" id="nInst" ' + (n.instant ? 'checked' : '') + '> Instant notifications</label></div>' +
      '<div class="frow"><label class="switch"><input type="checkbox" id="nDig" ' + (n.digest ? 'checked' : '') + '> Daily digest</label></div>' +
      '<div class="frow"><label>Recipient</label><input id="nTo" value="' + esc(n.recipient || '') + '" style="max-width:320px"></div>' +
      '<button class="btn small primary" onclick="ttAdminSet(\'notif\',{instant:$(\'nInst\').checked,digest:$(\'nDig\').checked,recipient:$(\'nTo\').value})">Save notifications</button>';
    var t = a.teams || { events: {} };
    var teams = '<div class="frow"><label>Webhook URL</label><input id="tUrl" placeholder="' + (t.hasUrl ? 'Saved (' + esc(t.urlTail) + '). Paste a new one to change it.' : 'Paste the Teams webhook URL') + '" style="max-width:420px"></div>' +
      Object.keys(t.events || {}).map(function (k) { return '<div class="frow"><label class="switch"><input type="checkbox" class="tEv" data-k="' + esc(k) + '" ' + (t.events[k] ? 'checked' : '') + '> ' + esc(k.replace(/([A-Z])/g, ' $1').replace(/^./, function (c) { return c.toUpperCase(); })) + '</label></div>'; }).join('') +
      '<button class="btn small primary" onclick="ttAdminTeams()">Save Teams</button> <button class="btn small" onclick="ttAdminTeamsTest()">Send test</button>';
    var lists = (a.lists || []).length ? '<div class="frow"><label>List</label><select id="vlName" onchange="ttAdminList()" style="max-width:320px">' + a.lists.map(function (l, i) { return '<option value="' + i + '">' + esc(l.name) + ' (' + l.values.length + ')</option>'; }).join('') + '</select></div>' +
      '<textarea id="vlVals" rows="10" style="width:100%"></textarea><div class="frow"><button class="btn small primary" onclick="ttAdminListSave()">Save list</button><span style="color:var(--muted);font-size:13px">One value per line. Then run Admin > Setup Data Validation.</span></div>'
      : '<div class="empty">No validation lists found on _ValidationLists.</div>';
    var trig = '<table class="grid"><tr><th>Handler</th><th>Type</th><th>Source</th></tr>' + (a.triggers || []).map(function (x) { return '<tr><td>' + esc(x.handler) + '</td><td>' + esc(x.type) + '</td><td>' + esc(x.source) + '</td></tr>'; }).join('') + '</table>' +
      '<div style="color:var(--muted);font-size:13px;margin-top:6px">' + (a.triggers || []).length + ' triggers. Read only: TechTrack is out of trigger slots, so the app never adds one.</div>';
    var maint = '<div class="frow"><button class="btn small" onclick="ttAdminClear()">Clear caches</button><span style="color:var(--muted);font-size:13px">The next screen reads live from the sheet.</span></div>' +
      '<div class="frow"><button class="btn small" onclick="openPortal(event)">Vendor Portal Admin</button><span style="color:var(--muted);font-size:13px">Invites, resets and who can sign in (Chris and Kyle need an Admin row).</span></div>' +
      '<div class="frow"><button class="btn small" onclick="ttTour(true)">Replay the tour</button><button class="btn small" onclick="go(\'help\')">Help and Training</button></div>';
    $('view').innerHTML = '<div class="hello" style="padding:12px 18px;"><b>Admin</b> <span style="color:var(--muted)">| people, access and TechTrack settings</span> <button class="btn small" style="float:right" onclick="S.plus.admin=null;render()">Reload</button></div>' +
      '<div class="grid2"><div>' + cardShell('ad:modes', 'Modes', '', '', '<div style="padding:4px 14px 12px">' + modes + '</div>', true) +
      cardShell('ad:notif', 'Notifications', '', '', '<div style="padding:4px 14px 12px">' + notif + '</div>', true) +
      cardShell('ad:teams', 'Microsoft Teams', '', '', '<div style="padding:4px 14px 12px">' + teams + '</div>', true) +
      cardShell('ad:maint', 'Maintenance', '', '', '<div style="padding:4px 14px 12px">' + maint + '</div>', true) + '</div><div>' +
      cardShell('ad:lists', 'Dropdown lists (_ValidationLists)', '', '', '<div style="padding:4px 14px 12px">' + lists + '</div>', true) +
      cardShell('ad:trig', 'Triggers', '', '', '<div style="padding:4px 14px 12px">' + trig + '</div>', false) +
      cardShell('ad:log', 'App Log', '', '<button class="btn small" onclick="event.stopPropagation();ttAdminLog()">Load</button>', '<div id="adLog" style="padding:4px 14px 12px"><div class="empty">Click Load to see the latest app and loader activity.</div></div>', false) +
      '</div></div>';
    if ((a.lists || []).length) ttAdminList();
  }
  window.ttAdminSet = function (what, value) {
    gs('ttAdminSet', S.token, what, value).then(function (r) { toast(r.msg || 'Saved'); S.plus.admin = null; if (S.view === 'admin') renderAdmin(true); }).catch(function (e) { toast(e.message, true); });
  };
  window.ttAdminTeams = function () {
    var ev = {}; Array.prototype.forEach.call(document.querySelectorAll('.tEv'), function (c) { ev[c.getAttribute('data-k')] = c.checked; });
    ttAdminSet('teams', { url: $('tUrl').value.trim(), events: ev });
  };
  window.ttAdminTeamsTest = function () { gs('ttAdminTeamsTest', S.token).then(function (r) { toast(r && r.success === false ? (r.error || 'Test failed') : 'Test sent to Teams', r && r.success === false); }).catch(function (e) { toast(e.message, true); }); };
  window.ttAdminList = function () { var l = S.plus.admin.lists[+$('vlName').value]; $('vlVals').value = l.values.join('\n'); };
  window.ttAdminListSave = function () { var l = S.plus.admin.lists[+$('vlName').value]; ttAdminSet('list', { name: l.name, values: $('vlVals').value.split('\n') }); };
  window.ttAdminClear = function () { gs('ttAdminClearCaches', S.token).then(function (r) { S.tables = {}; S.reports = {}; S.plus.hub.data = {}; S.plus.ins = null; S.plus.com = {}; toast(r.msg); }).catch(function (e) { toast(e.message, true); }); };
  window.ttAdminLog = function () {
    $('adLog').innerHTML = '<div class="loading"><span class="spin"></span>Loading...</div>';
    gs('ttAdminLog', S.token, 150).then(function (L) {
      var tbl = function (t, title) { if (!t.rows.length) return '<div class="empty">' + esc(title) + ': nothing yet.</div>'; return '<div style="font-weight:bold;margin:8px 0 4px">' + esc(title) + '</div><div class="gridwrap" style="max-height:320px"><table class="grid"><tr>' + t.headers.map(function (h) { return '<th>' + esc(h) + '</th>'; }).join('') + '</tr>' + t.rows.map(function (r) { return '<tr>' + r.map(function (v) { return '<td>' + esc(v) + '</td>'; }).join('') + '</tr>'; }).join('') + '</table></div>'; };
      $('adLog').innerHTML = tbl(L.app, 'TechTrack App Log') + tbl(L.loaders, 'Loader Run Log');
    }).catch(function (e) { $('adLog').innerHTML = '<div class="conf">' + esc(e.message) + '</div>'; });
  };

  /* ===================== COMMITTEE GLANCE ===================== */
  var COM = { weekly: { label: 'Weekly Committee Glance', classic: 'showWeeklyCommitteeGlance' }, T53: { label: 'T53 Committee Glance', classic: 'showT53CommitteeGlance' }, OTHER: { label: 'Committee Glance - Other Funds', classic: 'showOtherFundsCommitteeGlance' } };
  var COMF = [['fund', 'Fund'], ['brand', 'Brand'], ['source', 'Source'], ['category', 'Category'], ['vendor', 'Vendor'], ['priority', 'Priority'], ['coupaStatus', 'Coupa Status']];
  function comRows(mode) {
    var d = S.plus.com[mode]; if (!d) return [];
    var f = S.plus.comF[mode] || {}, q = norm(f.q || '');
    return d.rows.filter(function (r) {
      for (var i = 0; i < COMF.length; i++) { var k = COMF[i][0]; if (f[k] && String(r[k] || '') !== f[k]) return false; }
      if (q && norm([r.hotel, r.hotelCode, r.project, r.vendor, r.category, r.notes].join(' ')).indexOf(q) === -1) return false;
      return true;
    });
  }
  function renderCommittee(mode) {
    var meta = COM[mode] || COM.weekly;
    hideBar();
    if (!S.plus.com[mode]) {
      $('view').innerHTML = '<div class="loading"><span class="spin"></span>Loading ' + esc(meta.label) + '...</div>';
      return gs('ttCommittee', S.token, mode).then(function (d) { S.plus.com[mode] = d; if (S.view === 'committee:' + mode) renderCommittee(mode); }).catch(function (e) { $('view').innerHTML = '<div class="conf">' + esc(e.message) + '</div>'; });
    }
    var d = S.plus.com[mode], f = S.plus.comF[mode] || (S.plus.comF[mode] = {});
    var rows = comRows(mode), tot = rows.reduce(function (a, r) { return a + (Number(r.cost) || 0); }, 0);
    var fl = COMF.map(function (x) {
      var vals = {}; d.rows.forEach(function (r) { if (r[x[0]]) vals[r[x[0]]] = 1; });
      var keys = Object.keys(vals).sort(); if (!keys.length) return '';

  var HELP = [
    ['Start here', '<p>New to TechTrack Web, or want the whole picture? Open the <b>TechTrack Web Guide</b> (how Web works, then every screen in the order of your left menu, searchable and printable) or <b>TechTrack Web Training</b> (hands-on modules that open each screen and start its page tour). Both are written for Web: the left menu, screens, buttons, the project panel and Save.</p><p><button class="btn small primary" onclick="go(\'guide\')">Open the Web Guide</button> <button class="btn small" onclick="go(\'training\')">Open Web Training</button> <button class="btn small" onclick="ttTour(true)">Take the menu tour</button></p>'],
    ['Getting around', '<p>Every screen is in the left menu, grouped by job: My Day, Company Summary, Insights and Reporting Hub on top, then Projects, Project Updates, Project Dashboards, Money, Committee, Hotels, Systems, Brands, Vendors, Tickets and Tasks, Alerts and Renewals, Reports, Tools, Admin and Archive. Groups start closed; click a group name to open it. Type in <b>Find in the menu</b> to jump to any screen. Anything new that has no group yet shows under <b>OTHER</b>.</p><p>In the top bar: <b>Smart Search</b> (a hotel code plus a topic, then Enter), <b>?</b> for help on the screen you are on, the <b>Vendor Portal</b> button (admins), and the <b>bell</b> (past-date plus in-approval projects; click it for My Day).</p>'],
    ['Filters, exports and cards', '<p>The Works bar under the top bar filters everything on the screen at once (Brand, Fund, RVP, Hotel, Status, Payment Status, Vendor, Category, and Search). Each active filter is a chip; click it to drop it, or Clear all. <b>Refresh</b> reads the data again now. <b>Expand all</b> and <b>Collapse all</b> open or close every card; cards start closed on every visit. <b>Export Excel</b>, <b>Print / PDF</b> and <b>Email as dashboard</b> give the Blue Box version of exactly what the filters show.</p>'],

    ['Page help on every screen', '<p>Press <b>?</b> in the top bar, or the <b>?</b> on any screen header: what the screen is for, where its data comes from, every part of the page, how-tos, what it changes behind the scenes, rules and gotchas, and related screens. <b>Tour this page</b> highlights each part (Escape stops it). <b>All pages</b> searches the help for every screen. <b>Web Guide</b> opens the full guide. Hover over a button, filter, column header or tile for a one-line explanation.</p>'],

  window.ttTour = function (force) {
    try { if (!force && localStorage.getItem('tt2_tour_done_1113b')) return; } catch (e) { }
    var i = 0, tip = null, hl = null, opened = null;
    function shutOpened() { if (opened) { opened.classList.add('shut'); opened = null; } }
    function end() { shutOpened(); if (tip) tip.remove(); if (hl) hl.classList.remove('tour-hl'); try { localStorage.setItem('tt2_tour_done_1113b', '1'); } catch (e) { } }
    function step() {
      shutOpened(); if (tip) tip.remove(); if (hl) hl.classList.remove('tour-hl');
      while (i < TOUR.length && !(function (n) { if (!n) return false; if (TOUR[i][3]) return true; var r = n.getBoundingClientRect(); return r.width > 0 && r.height > 0; })(document.querySelector(TOUR[i][0]))) i++;
      if (i >= TOUR.length) return end();
      var s = TOUR[i]; hl = document.querySelector(s[0]); var og = s[3] ? (hl.classList.contains('nav-group') ? hl : hl.closest('.nav-group')) : null; if (og && og.classList.contains('shut')) { og.classList.remove('shut'); opened = og; } hl.classList.add('tour-hl'); if (hl.scrollIntoView) hl.scrollIntoView({ block: 'nearest' });
      var r = hl.getBoundingClientRect();
      tip = document.createElement('div'); tip.className = 'tour-tip';
      tip.innerHTML = '<h4>' + esc(s[1]) + ' <span style="color:var(--muted);font-weight:normal;font-size:12px">' + (i + 1) + ' of ' + TOUR.length + '</span></h4><div>' + esc(s[2]) + '</div><div class="tf"><button class="btn small">Skip</button><button class="btn small primary">' + (i === TOUR.length - 1 ? 'Done' : 'Next') + '</button></div>';
      document.body.appendChild(tip);
      var left = r.right + 14, top = r.top;
      if (left + 370 > window.innerWidth) { left = Math.max(10, r.left); top = r.bottom + 10; }
      if (top + tip.offsetHeight > window.innerHeight) top = Math.max(10, window.innerHeight - tip.offsetHeight - 10);
      tip.style.left = left + 'px'; tip.style.top = Math.max(10, top) + 'px';
      var b = tip.querySelectorAll('button'); b[0].onclick = end; b[1].onclick = function () { i++; step(); };
    }
    step();
  };
  // First run: start the tour once the nav is drawn.
  var tw = setInterval(function () { if (S.boot && document.querySelector('#nav .nav-group')) { clearInterval(tw); setTimeout(function () { ttTour(false); }, 800); } }, 500);
  setTimeout(function () { clearInterval(tw); }, 60000);

  /* ===================== BACKGROUND PRELOAD (Chris, Nov 1 2026) =====================
     After My Day shows, every screen's data loads quietly, one item at a time.
     Anything you click goes first: the preload waits while one of your requests is running.
     If you open a screen that is mid-preload, the app joins that same request (no double load). */
  var baseGs = window.gs, inflight = {}, userBusy = 0, lastUser = 0;
  var SHARE = { ttGetTables: 1, ttGetReport: 1, ttCommittee: 1, ttHubData: 1, ttHubSources: 1, ttHubSaved: 1, ttInsights: 1, ttAdminGet: 1, ttMenu: 1 };
  function callKey(fn, args) {
    if (!SHARE[fn]) return '';
    var a = args.slice(1); // drop the token
    if (fn === 'ttGetTables' && a[1] === true) return ''; // Refresh always reads live
    if (fn === 'ttHubData' && a[1] === true) return '';
    return fn + '|' + JSON.stringify(a);
  }
  function wrappedGs(isPre, fn, args) {
    var key = callKey(fn, args);
    if (key && inflight[key]) { if (!isPre) inflight[key].user = true; return inflight[key].p; }
    if (!isPre) { userBusy++; lastUser = Date.now(); }
    var p = baseGs.apply(null, [fn].concat(args));
    var done = function () { if (!isPre) { userBusy--; lastUser = Date.now(); } if (key) delete inflight[key]; };
    p.then(done, done);
    if (key) inflight[key] = { p: p, user: !isPre };
    return p;
  }
  window.gs = function (fn) { return wrappedGs(false, fn, Array.prototype.slice.call(arguments, 1)); };
  function pre(fn) { return wrappedGs(true, fn, Array.prototype.slice.call(arguments, 1)); }

  var preStarted = false;
  window.ttPrefetch = function () {
    if (preStarted || !S.boot) return; preStarted = true;
    var q = [];
    var tables = (S.boot.tables || []).map(function (t) { return t.sheet; });
    var first = ['Future Capex', 'Capex Committee', 'Secured Quotes', 'Overdue Payments', 'Archived Capex'];
    var order = first.filter(function (t) { return tables.indexOf(t) !== -1; }).concat(tables.filter(function (t) { return first.indexOf(t) === -1; }));
    function addTable(sh) { q.push(function () { if (S.tables[sh]) return null; return pre('ttGetTables', S.token, [sh], false).then(function (x) { if (!S.tables[sh] && x && x[sh]) S.tables[sh] = x[sh]; }); }); }
    order.slice(0, 5).forEach(addTable);
    (S.boot.reports || []).forEach(function (r) { q.push(function () { if (S.reports[r.name]) return null; return pre('ttGetReport', S.token, r.name, false).then(function (x) { if (!S.reports[r.name]) S.reports[r.name] = x; }); }); });
    ['weekly', 'T53', 'OTHER'].forEach(function (m) { q.push(function () { if (S.plus.com[m]) return null; return pre('ttCommittee', S.token, m).then(function (d) { if (!S.plus.com[m]) S.plus.com[m] = d; }); }); });
    q.push(function () { if (S.plus.ins) return null; return pre('ttInsights', S.token).then(function (d) { if (!S.plus.ins) S.plus.ins = d; }); });
    q.push(function () { if (S.plus.hub.sources) return null; return Promise.all([pre('ttHubSources', S.token), pre('ttHubSaved', S.token)]).then(function (x) { if (!S.plus.hub.sources) { S.plus.hub.sources = x[0]; S.plus.hub.saved = x[1]; } }); });
    q.push(function () { if (S.plus.admin) return null; return pre('ttAdminGet', S.token).then(function (a) { if (!S.plus.admin) S.plus.admin = a; }); });
    order.slice(5).forEach(addTable);
    var i = 0;
    (function next() {
      if (i >= q.length || !S.token) return;
      // Wait while you are using the app: your request runs alone, then a short pause.
      if (userBusy > 0 || Date.now() - lastUser < 700) return setTimeout(next, 400);
      var job = q[i++], p = null;
      try { p = job(); } catch (e) { p = null; }
      (p || Promise.resolve()).then(function () { setTimeout(next, 150); }, function () { setTimeout(next, 150); });
    })();
  };

  // Checklist pop-ups caught during Save automations open the Checklist tab.
  window.openChecklistFor = function () { if (S.drawer && S.drawer.mode !== 'new' && typeof dTab === 'function') { try { dTab('checklist'); toast('Completion checklist is ready'); } catch (e) { } } };
})();
